<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="thumbGrad" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#1e5cff"/>
        <stop offset="1" stop-color="#3ce6a8"/>
      </linearGradient>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand"><span class="brand-mark">♪</span>Audio Visualizer</div>
    <button id="quitBtn" class="btn ghost danger" title="앱을 종료합니다">종료</button>
  </header>

  <main class="layout">
    <aside class="panel">
      <section class="card upload-card">
        <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="오디오 파일 업로드">
          <div class="dz-idle" id="dzIdle">
            <div class="dz-icon">⇪</div>
            <div class="dz-title">오디오 파일을 끌어다 놓거나</div>
            <div class="dz-sub">클릭하여 선택하세요</div>
            <div class="dz-formats">mp3 · wav · flac · ogg · m4a · opus …</div>
          </div>
          <div class="dz-busy hidden" id="dzBusy">
            <div class="spinner"></div>
            <div id="dzStatus" class="dz-status">업로드 중…</div>
          </div>
          <div class="dz-loaded hidden" id="dzLoaded">
            <div id="dzName" class="dz-name"></div>
            <div id="dzMeta" class="dz-meta"></div>
            <div class="dz-replace">클릭하여 다른 파일 선택</div>
          </div>
        </div>
        <input type="file" id="fileInput" accept=".mp3,.wav,.flac,.ogg,.opus,.m4a,.aac,.wma,.aiff,.aif" hidden>
      </section>

      <section class="group">
        <h3>스타일</h3>
        <div class="style-grid" id="styleGrid">
          <button class="style-thumb" data-style="bars" aria-pressed="true" title="bar spectrum">
            <svg viewBox="0 0 64 36" fill="url(#thumbGrad)">
              <rect x="5" y="22" width="5" height="10" rx="2.5"/>
              <rect x="13" y="14" width="5" height="18" rx="2.5"/>
              <rect x="21" y="6" width="5" height="26" rx="2.5"/>
              <rect x="29" y="18" width="5" height="14" rx="2.5"/>
              <rect x="37" y="10" width="5" height="22" rx="2.5"/>
              <rect x="45" y="4" width="5" height="28" rx="2.5"/>
              <rect x="53" y="20" width="5" height="12" rx="2.5"/>
            </svg>
            <span>bars</span>
          </button>
          <button class="style-thumb" data-style="waveform" aria-pressed="false" title="waveform">
            <svg viewBox="0 0 64 36" fill="none" stroke="url(#thumbGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 18 L10 10 L16 24 L22 6 L28 30 L34 14 L40 22 L46 8 L52 26 L60 18"/>
            </svg>
            <span>waveform</span>
          </button>
          <button class="style-thumb" data-style="line" aria-pressed="false" title="line spectrum">
            <svg viewBox="0 0 64 36" fill="none" stroke="url(#thumbGrad)" stroke-width="2.5" stroke-linecap="round">
              <path d="M4 28 C12 28 14 10 22 12 S32 30 40 24 S52 6 60 14"/>
            </svg>
            <span>line</span>
          </button>
          <button class="style-thumb" data-style="radial_bars" aria-pressed="false" title="radial bars">
            <svg viewBox="0 0 64 36" fill="none" stroke="url(#thumbGrad)" stroke-width="2" stroke-linecap="round">
              <circle cx="32" cy="18" r="5" stroke-width="1.5"/>
              <line x1="40.0" y1="18.0" x2="46.0" y2="18.0"/>
              <line x1="37.7" y1="23.7" x2="40.5" y2="26.5"/>
              <line x1="32.0" y1="26.0" x2="32.0" y2="31.0"/>
              <line x1="26.3" y1="23.7" x2="22.1" y2="27.9"/>
              <line x1="24.0" y1="18.0" x2="19.0" y2="18.0"/>
              <line x1="26.3" y1="12.3" x2="23.5" y2="9.5"/>
              <line x1="32.0" y1="10.0" x2="32.0" y2="5.0"/>
              <line x1="37.7" y1="12.3" x2="41.9" y2="8.1"/>
            </svg>
            <span>radial bars</span>
          </button>
          <button class="style-thumb" data-style="circle_wave" aria-pressed="false" title="circle wave">
            <svg viewBox="0 0 64 36" fill="none" stroke="url(#thumbGrad)" stroke-width="2" stroke-linejoin="round">
              <path d="M41.0 18.0 L42.8 20.9 L39.8 22.5 L36.8 22.8 L36.5 25.8 L34.9 28.8 L32.0 27.0 L30.2 24.6 L27.5 25.8 L24.1 25.9 L24.2 22.5 L25.4 19.8 L23.0 18.0 L21.2 15.1 L24.2 13.5 L27.2 13.2 L27.5 10.2 L29.1 7.2 L32.0 9.0 L33.8 11.4 L36.5 10.2 L39.9 10.1 L39.8 13.5 L38.6 16.2 Z"/>
            </svg>
            <span>circle wave</span>
          </button>
        </div>
      </section>

      <section class="group">
        <h3>색상</h3>
        <div class="row">
          <label for="color1">색상 1</label>
          <input type="color" id="color1" value="#3ce6a8">
        </div>
        <div class="row">
          <label for="color2">색상 2</label>
          <input type="color" id="color2" value="#1e5cff">
        </div>
        <div class="row">
          <label for="gradient">그라디언트</label>
          <input type="checkbox" id="gradient" checked>
        </div>
      </section>

      <section class="group">
        <h3>배경</h3>
        <div class="row radio-row">
          <label class="radio-label"><input type="radio" name="bgmode" value="transparent">
            투명 <span class="checker-swatch" title="알파 채널 포함 (.webm)"></span></label>
        </div>
        <div class="row radio-row">
          <label class="radio-label"><input type="radio" name="bgmode" value="solid" checked> 단색</label>
          <input type="color" id="bgColor" value="#101014">
        </div>
        <div class="row radio-row">
          <label class="radio-label"><input type="radio" name="bgmode" value="image"> 이미지</label>
          <button id="bgImageBtn" class="btn ghost small" type="button">선택…</button>
        </div>
        <div class="row bg-thumb-row hidden" id="bgThumbRow">
          <img id="bgThumb" alt="배경 이미지">
        </div>
        <input type="file" id="bgFileInput" accept=".png,.jpg,.jpeg,.webp,.bmp,.gif" hidden>
      </section>

      <section class="group">
        <h3>해상도</h3>
        <div class="row radio-row"><label class="radio-label"><input type="radio" name="res" value="1920x1080" checked> 1920 × 1080</label></div>
        <div class="row radio-row"><label class="radio-label"><input type="radio" name="res" value="3840x2160"> 3840 × 2160 <span class="tag">4K</span></label></div>
        <div class="row radio-row"><label class="radio-label"><input type="radio" name="res" value="1920x400"> 1920 × 400 <span class="tag">스트립</span></label></div>
        <div class="row radio-row"><label class="radio-label"><input type="radio" name="res" value="custom"> 사용자 지정</label></div>
        <div class="row custom-size">
          <input type="number" id="customW" value="1920" min="16" max="4096" step="2" disabled aria-label="너비">
          <span class="x">×</span>
          <input type="number" id="customH" value="1080" min="16" max="4096" step="2" disabled aria-label="높이">
        </div>
      </section>

      <section class="group">
        <h3>프레임 레이트</h3>
        <div class="seg" role="radiogroup" aria-label="프레임 레이트">
          <label><input type="radio" name="fps" value="30"><span>30 fps</span></label>
          <label><input type="radio" name="fps" value="60" checked><span>60 fps</span></label>
        </div>
      </section>

      <section class="group">
        <h3>렌더 품질</h3>
        <div class="row">
          <label for="quality">품질</label>
          <select id="quality">
            <option value="fast">빠름</option>
            <option value="balanced" selected>균형</option>
            <option value="best">최고</option>
          </select>
        </div>
        <div class="row" id="codecRow">
          <label for="codec">코덱</label>
          <select id="codec">
            <option value="av1_nvenc" selected>AV1 (NVENC · 빠름)</option>
            <option value="vp9">VP9 (호환성)</option>
          </select>
        </div>
        <div class="hint hidden" id="alphaHint">투명 배경은 VP9 알파로 인코딩됩니다</div>
      </section>

      <section class="group">
        <h3>감도</h3>
        <div class="row">
          <input type="range" id="sensitivity" min="0.2" max="3" step="0.05" value="1" aria-label="감도">
          <span class="sens-value" id="sensValue">1.00×</span>
        </div>
      </section>
    </aside>

    <section class="content">
      <div class="stage" id="stage">
        <div class="preview-box" id="previewBox">
          <canvas id="preview"></canvas>
          <div class="placeholder" id="placeholder">오디오를 업로드하면 미리보기가 표시됩니다</div>
          <div class="overlay hidden" id="exportOverlay">
            <div class="spinner"></div>
            <div>렌더링 중 — 미리보기 일시정지</div>
          </div>
        </div>
      </div>

      <div class="transport card">
        <button id="playBtn" class="btn icon" disabled aria-label="재생/일시정지">▶</button>
        <span id="curTime" class="time">0:00</span>
        <canvas id="seekbar" aria-label="탐색 바"></canvas>
        <span id="totalTime" class="time">0:00</span>
        <div class="volume">
          <span class="vol-ico" aria-hidden="true">🔊</span>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="1" aria-label="볼륨">
        </div>
      </div>

      <div class="export card">
        <button id="renderBtn" class="btn primary" disabled>⚡ 렌더 시작</button>
        <div class="progress-wrap hidden" id="progressWrap">
          <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-stats">
            <span id="progPct">0%</span>
            <span id="progFps"></span>
            <span id="progEta"></span>
          </div>
          <button id="cancelBtn" class="btn ghost small">취소</button>
        </div>
      </div>

      <div class="renders card">
        <div class="renders-head">
          <h3>완료된 렌더</h3>
          <button id="openFolderBtn" class="btn ghost small">폴더 열기</button>
        </div>
        <ul id="rendersList" class="renders-list"></ul>
        <div id="rendersEmpty" class="renders-empty">아직 완료된 렌더가 없습니다</div>
      </div>
    </section>
  </main>

  <audio id="player" preload="auto"></audio>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
