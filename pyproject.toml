[project]
name = "audio-visualizer"
version = "0.1.0"
description = "GPU-accelerated audio visualizer: MP3 in, editor-ready .webm out"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0",
    "moderngl>=5.12",
    "pillow>=10.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
visualizer = "visualizer.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visualizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
